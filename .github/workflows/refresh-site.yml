name: Refresh site data

on:
  schedule:
    - cron: "0 14 * * *" # daily; Vercel redeploys on the resulting commit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-site
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch data, rebuild features, retrain, export
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python -m src.ingest.ufcstats --bootstrap
          python -m src.ingest.refresh
          python -m src.model.train
          python -m src.model.backtest
          python -m src.ingest.odds_history
          python -m src.model.market
          python -m src.ledger
          python -m src.export.site
      - name: Commit updated data.json and ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json data/ledger
          git diff --cached --quiet || (git commit -m "chore: refresh site data and prediction ledger" && git push)
