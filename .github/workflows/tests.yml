name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests (synthetic data)
        run: pytest -m "not realdata"
      - name: Fetch seed data and run leakage tests on the real UFC Stats history
        run: |
          python -m src.ingest.ufcstats --bootstrap
          pytest -m realdata
